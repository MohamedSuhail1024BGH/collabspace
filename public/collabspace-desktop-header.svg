<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" role="img" aria-labelledby="tdesc">
  <title id="tdesc">CollabSpace desktop chat header mockup</title>
  <desc>Desktop reference header layout (56px h-14, surface-container) featuring the Bridge tiles identity, breadcrumbs, search, and session controls.</desc>
  <!-- Background & bottom border -->
  <rect width="1200" height="56" fill="#1E1F26"/>
  <line x1="0" y1="55.5" x2="1200" y2="55.5" stroke="#282A30" stroke-width="1"/>

  <!-- Left: CollabSpace Bridge Tiles identity (32px scale) -->
  <g transform="translate(20, 12)">
    <g transform="scale(0.5)">
      <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="#111319" stroke="#282a30" stroke-width="1"/>
      <rect x="13" y="14" width="19" height="19" rx="5" fill="#8083ff"/>
      <rect x="32" y="31" width="19" height="19" rx="5" fill="#4edea3"/>
      <path d="M28 25.5 H36 A6 6 0 0 1 42 31.5 V34.5" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="42" y="21" fill="#F8FAFC" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="-0.3">CollabSpace</text>
    <rect x="124" y="9" width="22" height="15" rx="3" fill="#282A30"/>
    <text x="135" y="20" fill="#4EDEA3" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" text-anchor="middle">v2</text>
  </g>

  <!-- Breadcrumb delimiter & conversation title -->
  <text x="180" y="33" fill="#464554" font-family="Geist, Inter, system-ui, sans-serif" font-size="14">/</text>
  <g transform="translate(196, 17)">
    <circle cx="11" cy="11" r="11" fill="#8083FF" fill-opacity="0.15"/>
    <text x="11" y="15" fill="#8083FF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">#</text>
    <text x="30" y="16" fill="#E2E2EB" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" font-weight="600">engineering-sprint</text>
    <circle cx="165" cy="11" r="3.5" fill="#4EDEA3"/>
    <text x="175" y="15" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">8 online</text>
  </g>

  <!-- Center: Search bar -->
  <g transform="translate(540, 11)">
    <rect width="260" height="34" rx="8" fill="#111319" stroke="#282A30" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="none" stroke="#908FA0" stroke-width="1.5"/>
    <line x1="24" y1="21" x2="28" y2="25" stroke="#908FA0" stroke-width="1.5" stroke-linecap="round"/>
    <text x="36" y="21" fill="#908FA0" font-family="Geist, Inter, system-ui, sans-serif" font-size="12">Search or jump to...</text>
    <rect x="220" y="8" width="28" height="18" rx="4" fill="#282A30"/>
    <text x="234" y="21" fill="#C7C4D7" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">⌘K</text>
  </g>

  <!-- Right: Actions & User avatar -->
  <g transform="translate(1030, 13)">
    <!-- SSE Status Pill -->
    <rect width="82" height="30" rx="6" fill="#111319" stroke="#282A30" stroke-width="1"/>
    <circle cx="14" cy="15" r="3.5" fill="#4EDEA3"/>
    <text x="24" y="19" fill="#4EDEA3" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500">CONNECTED</text>

    <!-- User Profile badge -->
    <g transform="translate(94, 1)">
      <rect width="64" height="28" rx="14" fill="#282A30"/>
      <circle cx="14" cy="14" r="11" fill="#8083FF"/>
      <text x="14" y="18" fill="#FFFFFF" font-family="Geist, Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AL</text>
      <circle cx="21" cy="21" r="3" fill="#4EDEA3" stroke="#1E1F26" stroke-width="1"/>
      <text x="34" y="18" fill="#E2E2EB" font-family="Geist, Inter, system-ui, sans-serif" font-size="11" font-weight="500">Ava</text>
    </g>
  </g>
</svg>

