<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="bs-title">
  <title id="bs-title">CollabSpace Brand Identity Verification Board — Bridge Tiles</title>
  <rect width="900" height="600" fill="#111319"/>
  <rect x="20" y="20" width="860" height="560" rx="12" fill="#191B22" stroke="#282A30" stroke-width="1"/>

  <!-- Title section -->
  <text x="50" y="65" fill="#F8FAFC" font-family="Geist, Inter, system-ui, sans-serif" font-size="22" font-weight="700">CollabSpace Brand Specification</text>
  <text x="50" y="88" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" letter-spacing="1">BRIDGE TILES SYSTEM · DESIGN SYSTEM COMPLIANT</text>
  <line x1="50" y1="104" x2="850" y2="104" stroke="#282A30" stroke-width="1"/>

  <!-- Section 1: Mark & Lockup -->
  <text x="50" y="135" fill="#C0C1FF" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600">01 / PRIMARY IDENTIFIERS</text>

  <!-- 64px Mark -->
  <g transform="translate(50, 155)">
    <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="#111319" stroke="#282a30" stroke-width="1"/>
    <rect x="13" y="14" width="19" height="19" rx="5" fill="#8083ff"/>
    <rect x="32" y="31" width="19" height="19" rx="5" fill="#4edea3"/>
    <path d="M28 25.5 H36 A6 6 0 0 1 42 31.5 V34.5" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <text x="80" y="30" fill="#E2E2EB" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" font-weight="600">Vector Logo Mark</text>
    <text x="80" y="48" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">64x64 viewBox (app/icon.svg, public/logo.svg)</text>
  </g>

  <!-- Wordmark lockup container -->
  <g transform="translate(50, 240)">
    <rect width="360" height="80" rx="8" fill="#111319" stroke="#282a30" stroke-width="1"/>
    <g transform="translate(8, 8)">
      <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="#111319" stroke="#282a30" stroke-width="1"/>
      <rect x="13" y="14" width="19" height="19" rx="5" fill="#8083ff"/>
      <rect x="32" y="31" width="19" height="19" rx="5" fill="#4edea3"/>
      <path d="M28 25.5 H36 A6 6 0 0 1 42 31.5 V34.5" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="84" y="45" fill="#F8FAFC" font-family="Geist, Inter, system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.5">CollabSpace</text>
    <text x="85" y="63" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" letter-spacing="1.8">WORK TOGETHER, IN CONTEXT</text>
  </g>

  <!-- Section 2: Scale Verification Board -->
  <text x="460" y="135" fill="#C0C1FF" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600">02 / SCALE &amp; RASTER FIDELITY</text>
  <g transform="translate(460, 155)">
    <!-- 64px -->
    <g transform="translate(0, 0)">
      <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="#111319" stroke="#282a30" stroke-width="1"/>
      <rect x="13" y="14" width="19" height="19" rx="5" fill="#8083ff"/>
      <rect x="32" y="31" width="19" height="19" rx="5" fill="#4edea3"/>
      <path d="M28 25.5 H36 A6 6 0 0 1 42 31.5 V34.5" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <text x="32" y="80" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">64px</text>
    </g>

    <!-- 48px -->
    <g transform="translate(85, 8) scale(0.75)">
      <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="#111319" stroke="#282a30" stroke-width="1"/>
      <rect x="13" y="14" width="19" height="19" rx="5" fill="#8083ff"/>
      <rect x="32" y="31" width="19" height="19" rx="5" fill="#4edea3"/>
      <path d="M28 25.5 H36 A6 6 0 0 1 42 31.5 V34.5" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="109" y="80" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">48px</text>

    <!-- 32px (Sidebar brand) -->
    <g transform="translate(155, 16) scale(0.5)">
      <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="#111319" stroke="#282a30" stroke-width="1"/>
      <rect x="13" y="14" width="19" height="19" rx="5" fill="#8083ff"/>
      <rect x="32" y="31" width="19" height="19" rx="5" fill="#4edea3"/>
      <path d="M28 25.5 H36 A6 6 0 0 1 42 31.5 V34.5" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="171" y="80" fill="#4EDEA3" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">32px*</text>

    <!-- 24px -->
    <g transform="translate(210, 20) scale(0.375)">
      <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="#111319" stroke="#282a30" stroke-width="1"/>
      <rect x="13" y="14" width="19" height="19" rx="5" fill="#8083ff"/>
      <rect x="32" y="31" width="19" height="19" rx="5" fill="#4edea3"/>
      <path d="M28 25.5 H36 A6 6 0 0 1 42 31.5 V34.5" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="222" y="80" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">24px</text>

    <!-- 16px (Favicon) -->
    <g transform="translate(255, 24) scale(0.25)">
      <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="#111319" stroke="#282a30" stroke-width="1"/>
      <rect x="13" y="14" width="19" height="19" rx="5" fill="#8083ff"/>
      <rect x="32" y="31" width="19" height="19" rx="5" fill="#4edea3"/>
      <path d="M28 25.5 H36 A6 6 0 0 1 42 31.5 V34.5" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="263" y="80" fill="#4EDEA3" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">16px*</text>
  </g>

  <!-- Callout note -->
  <g transform="translate(460, 260)">
    <rect width="390" height="60" rx="6" fill="#111319" stroke="#282A30" stroke-width="1"/>
    <circle cx="20" cy="20" r="8" fill="#8083FF" fill-opacity="0.2"/>
    <text x="20" y="24" fill="#8083FF" font-family="Geist, Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">i</text>
    <text x="36" y="22" fill="#E2E2EB" font-family="Geist, Inter, system-ui, sans-serif" font-size="11" font-weight="500">Bridge stroke: 5px (~1.25px at 16px favicon scale).</text>
    <text x="36" y="38" fill="#94A3B8" font-family="Geist, Inter, system-ui, sans-serif" font-size="11">Survives browser rasterization with complete geometric legibility.</text>
  </g>

  <!-- Section 3: Token Palette Verification -->
  <text x="50" y="365" fill="#C0C1FF" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600">03 / DESIGN SYSTEM COLOR TOKENS</text>
  <g transform="translate(50, 385)">
    <!-- Swatch 1: Background/Surface #111319 -->
    <g transform="translate(0, 0)">
      <rect width="115" height="50" rx="6" fill="#111319" stroke="#282A30" stroke-width="1"/>
      <text x="10" y="70" fill="#E2E2EB" font-family="Geist, Inter, system-ui, sans-serif" font-size="11" font-weight="600">Surface</text>
      <text x="10" y="86" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">#111319</text>
    </g>

    <!-- Swatch 2: Surface High #282A30 -->
    <g transform="translate(130, 0)">
      <rect width="115" height="50" rx="6" fill="#282A30" stroke="#464554" stroke-width="1"/>
      <text x="10" y="70" fill="#E2E2EB" font-family="Geist, Inter, system-ui, sans-serif" font-size="11" font-weight="600">Border/Card</text>
      <text x="10" y="86" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">#282A30</text>
    </g>

    <!-- Swatch 3: Primary #8083FF -->
    <g transform="translate(260, 0)">
      <rect width="115" height="50" rx="6" fill="#8083FF"/>
      <text x="10" y="70" fill="#E2E2EB" font-family="Geist, Inter, system-ui, sans-serif" font-size="11" font-weight="600">Indigo Primary</text>
      <text x="10" y="86" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">#8083FF</text>
    </g>

    <!-- Swatch 4: Secondary #4EDEA3 -->
    <g transform="translate(390, 0)">
      <rect width="115" height="50" rx="6" fill="#4EDEA3"/>
      <text x="10" y="70" fill="#E2E2EB" font-family="Geist, Inter, system-ui, sans-serif" font-size="11" font-weight="600">Emerald Secondary</text>
      <text x="10" y="86" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">#4EDEA3</text>
    </g>

    <!-- Swatch 5: Bridge White #FFFFFF -->
    <g transform="translate(520, 0)">
      <rect width="115" height="50" rx="6" fill="#FFFFFF"/>
      <text x="10" y="70" fill="#E2E2EB" font-family="Geist, Inter, system-ui, sans-serif" font-size="11" font-weight="600">Bridge Link</text>
      <text x="10" y="86" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">#FFFFFF</text>
    </g>

    <!-- Swatch 6: Text On Surface #F8FAFC -->
    <g transform="translate(650, 0)">
      <rect width="115" height="50" rx="6" fill="#F8FAFC"/>
      <text x="10" y="70" fill="#E2E2EB" font-family="Geist, Inter, system-ui, sans-serif" font-size="11" font-weight="600">Text Primary</text>
      <text x="10" y="86" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">#F8FAFC</text>
    </g>
  </g>

  <!-- Section 4: Typography specs -->
  <text x="50" y="515" fill="#C0C1FF" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600">04 / TYPOGRAPHY RULES</text>
  <text x="50" y="538" fill="#E2E2EB" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" font-weight="600">Display &amp; Title: Geist, Inter, system-ui (Weight 600, Tracking -0.5)</text>
  <text x="50" y="556" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Sub-brand Tagline &amp; Metadata: JetBrains Mono (Weight 500, Tracking 1.8)</text>
</svg>

